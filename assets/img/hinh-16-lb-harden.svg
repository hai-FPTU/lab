<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Kết quả hardening trước và sau">
  <rect width="820" height="340" fill="#fff"/>
  <text x="14" y="24" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#16202A">Bài 3.1 · Đo mức tuân thủ trước và sau khi hardening</text>

  <rect x="14" y="40" width="268" height="100" rx="6" fill="#FBF3F3" stroke="#EBD6D6"/>
  <text x="148" y="62" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#A31621" text-anchor="middle">Trước</text>
  <text x="148" y="104" font-family="'Segoe UI',system-ui,sans-serif" font-size="38" font-weight="700" fill="#A31621" text-anchor="middle">61</text>
  <text x="148" y="126" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#39444F" text-anchor="middle">Hardening index · 6 cảnh báo</text>

  <text x="148" y="162" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" fill="#6E7A87" text-anchor="middle">↓</text>

  <rect x="14" y="178" width="268" height="100" rx="6" fill="#F0F6F3" stroke="#D3E5DC"/>
  <text x="148" y="200" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#15604E" text-anchor="middle">Sau khi khắc phục bảy mục</text>
  <text x="148" y="242" font-family="'Segoe UI',system-ui,sans-serif" font-size="38" font-weight="700" fill="#15604E" text-anchor="middle">73</text>
  <text x="148" y="264" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#39444F" text-anchor="middle">Hardening index · 2 cảnh báo</text>

  <text x="300" y="90" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#16202A">Bảy mục đã chọn khắc phục</text>
  <rect x="300" y="108" width="506" height="26" rx="4" fill="#EEF1F4"/><circle cx="318" cy="121" r="6" fill="#15604E"/><path d="M315 121 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="125" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Cấu hình truy cập từ xa</text><text x="560" y="125" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">PermitRootLogin, PasswordAuthentication, MaxAuthTries</text><rect x="300" y="138" width="506" height="26" rx="4" fill="#fff"/><circle cx="318" cy="151" r="6" fill="#15604E"/><path d="M315 151 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="155" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Dịch vụ không dùng đến</text><text x="560" y="155" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">avahi-daemon, cups, bluetooth</text><rect x="300" y="168" width="506" height="26" rx="4" fill="#EEF1F4"/><circle cx="318" cy="181" r="6" fill="#15604E"/><path d="M315 181 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="185" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Quyền trên file tác vụ theo lịch</text><text x="560" y="185" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">chmod 600 /etc/crontab</text><rect x="300" y="198" width="506" height="26" rx="4" fill="#fff"/><circle cx="318" cy="211" r="6" fill="#15604E"/><path d="M315 211 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="215" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Ghi log tiến trình</text><text x="560" y="215" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">auditd</text><rect x="300" y="228" width="506" height="26" rx="4" fill="#EEF1F4"/><circle cx="318" cy="241" r="6" fill="#15604E"/><path d="M315 241 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="245" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Thời gian chờ phiên làm việc</text><text x="560" y="245" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">TMOUT 900</text><rect x="300" y="258" width="506" height="26" rx="4" fill="#fff"/><circle cx="318" cy="271" r="6" fill="#15604E"/><path d="M315 271 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="275" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Chặn thiết bị lưu trữ ngoài</text><text x="560" y="275" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">modprobe usb-storage</text><rect x="300" y="288" width="506" height="26" rx="4" fill="#EEF1F4"/><circle cx="318" cy="301" r="6" fill="#15604E"/><path d="M315 301 l2.2 2.4 l4.4 -5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="334" y="305" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16202A">Kiểm tra cú pháp trước khi áp dụng</text><text x="560" y="305" font-family="'Cascadia Code',Consolas,monospace" font-size="10" fill="#6E7A87">sshd -t</text>

  <rect x="14" y="294" width="792" height="34" rx="5" fill="#FBF7F0"/>
  <text x="30" y="316" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#9A6B00" font-weight="600">Chỉ số là con số để so sánh, không phải mục tiêu tối đa hoá. Máy 90 điểm mà ứng dụng không chạy thì tệ hơn máy 73 điểm chạy tốt.</text>
</svg>