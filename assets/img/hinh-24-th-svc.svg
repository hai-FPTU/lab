  <text x="30" y="285" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#A31621">1 trên 2.732 lần. Service account đăng nhập tương tác là hành vi không bao giờ hợp lệ.</text>
