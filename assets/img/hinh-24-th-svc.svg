tác</text><rect x="290" y="238" width="4" height="16" rx="2" fill="#A31621"/><text x="302" y="251" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#A31621">1 lần</text>
