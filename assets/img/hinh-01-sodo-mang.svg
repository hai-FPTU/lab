<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Sơ đồ mạng ba máy ảo và tường lửa">
  <defs>
    <marker id="mt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6E7A87"/>
    </marker>
  </defs>
  <rect width="820" height="430" fill="#fff"/>

  <!-- Internet -->
  <rect x="320" y="14" width="180" height="40" rx="6" fill="#EEF1F4" stroke="#CFD7DE"/>
  <text x="410" y="39" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#39444F" text-anchor="middle">NAT · Internet</text>
  <line x1="410" y1="54" x2="410" y2="92" stroke="#6E7A87" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#mt)"/>
  <text x="420" y="78" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#6E7A87">WAN · chỉ bật khi cần</text>

  <!-- Tường lửa -->
  <rect x="280" y="92" width="260" height="86" rx="8" fill="#16202A"/>
  <text x="410" y="120" font-family="'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#fff" text-anchor="middle">fw-edge-01 · pfSense 2.7</text>
  <text x="410" y="142" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#9FB0C0" text-anchor="middle">Tường lửa biên · Suricata IDS</text>
  <text x="410" y="163" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#9FB0C0" text-anchor="middle">2 GB RAM · 8 GB đĩa</text>

  <!-- nhánh trái -->
  <path d="M300 178 L300 214 L190 214 L190 250" fill="none" stroke="#15604E" stroke-width="2" marker-end="url(#mt)"/>
  <text x="196" y="207" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#15604E" font-weight="600">LAN em1 · 192.168.10.1</text>

  <!-- nhánh phải -->
  <path d="M520 178 L520 214 L630 214 L630 250" fill="none" stroke="#A31621" stroke-width="2" marker-end="url(#mt)"/>
  <text x="540" y="207" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#A31621" font-weight="600">OPT1 em2 · 192.168.20.1</text>

  <!-- Ubuntu -->
  <rect x="60" y="250" width="260" height="150" rx="8" fill="#fff" stroke="#15604E" stroke-width="2"/>
  <rect x="60" y="250" width="260" height="30" rx="8" fill="#15604E"/>
  <rect x="60" y="270" width="260" height="10" fill="#15604E"/>
  <text x="190" y="271" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">srv-app-01 · Ubuntu 22.04</text>
  <text x="190" y="303" font-family="'Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#16202A" text-anchor="middle">192.168.10.20</text>
  <text x="80" y="328" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">• Loki 3100 · Grafana 3000</text>
  <text x="80" y="349" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">• Promtail · auditd · Lynis</text>
  <text x="80" y="370" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">• Server mục tiêu</text>
  <text x="80" y="391" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#6E7A87">4 GB RAM · 40 GB đĩa</text>

  <!-- Kali -->
  <rect x="500" y="250" width="260" height="150" rx="8" fill="#fff" stroke="#A31621" stroke-width="2"/>
  <rect x="500" y="250" width="260" height="30" rx="8" fill="#A31621"/>
  <rect x="500" y="270" width="260" height="10" fill="#A31621"/>
  <text x="630" y="271" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">wks-soc-01 · Kali Linux</text>
  <text x="630" y="303" font-family="'Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#16202A" text-anchor="middle">192.168.20.10</text>
  <text x="520" y="328" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">• grep · awk · jq · nmap</text>
  <text x="520" y="349" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">• Python · Jupyter · Ollama</text>
  <text x="520" y="370" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">• Máy phân tích</text>
  <text x="520" y="391" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#6E7A87">4 GB RAM · 40 GB đĩa</text>

  <text x="410" y="424" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6E7A87" text-anchor="middle">Mọi lưu lượng giữa hai phân đoạn đều đi qua tường lửa, nhờ đó sinh ra log mạng</text>
</svg>