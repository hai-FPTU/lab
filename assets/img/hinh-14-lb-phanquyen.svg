<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Bảy vi phạm least privilege đã cấy">
  <rect width="820" height="320" fill="#fff"/>
  <text x="14" y="26" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#16202A">Bảy vi phạm least privilege đã được cấy trên máy Ubuntu</text>
  <text x="14" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#6E7A87">Mức Cơ bản cần tìm được ít nhất năm. Mức Mở rộng cần tìm đủ bảy.</text>
  <rect x="14" y="66" width="792" height="44" rx="5" fill="#FBF3F3"/><circle cx="42" cy="88" r="14" fill="#A31621"/><text x="42" y="93" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="72" y="93" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#16202A">SUID bất thường</text><text x="340" y="93" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">find / -perm /6000</text><rect x="14" y="120" width="792" height="44" rx="5" fill="#FBF3F3"/><circle cx="42" cy="142" r="14" fill="#A31621"/><text x="42" y="147" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="72" y="147" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#16202A">Tài khoản thừa quyền sudo</text><text x="340" y="147" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">grep sudo /etc/group</text><rect x="14" y="174" width="792" height="44" rx="5" fill="#FBF7F0"/><circle cx="42" cy="196" r="14" fill="#9A6B00"/><text x="42" y="201" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="72" y="201" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#16202A">File ai cũng ghi được</text><text x="340" y="201" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">find / -perm -0002</text><rect x="14" y="228" width="792" height="44" rx="5" fill="#FBF7F0"/><circle cx="42" cy="250" r="14" fill="#9A6B00"/><text x="42" y="255" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="72" y="255" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#16202A">ACL mở rộng sai</text><text x="340" y="255" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">getfacl /etc/shadow</text>
  <rect x="14" y="288" width="792" height="26" rx="5" fill="#F0F6F3"/>
  <text x="30" y="305" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#15604E" font-weight="600">Dùng gpasswd -d để gỡ khỏi nhóm. Không dùng usermod -G vì lệnh đó thay thế toàn bộ danh sách nhóm phụ.</text>
</svg>