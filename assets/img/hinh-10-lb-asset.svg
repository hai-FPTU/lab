<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Đối chiếu kết quả quét với asset inventory">
  <rect width="820" height="320" fill="#fff"/>
  <text x="14" y="22" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#16202A">Đối chiếu hai danh sách để tìm khoảng trống</text>

  <rect x="14" y="38" width="248" height="200" rx="6" fill="#EEF1F4" stroke="#CFD7DE"/>
  <text x="138" y="60" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#16202A" text-anchor="middle">Quét bằng nmap</text>
  <text x="138" y="78" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#6E7A87" text-anchor="middle">Thực tế đang chạy</text>
  <text x="30" y="104" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.1</text><text x="30" y="128" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.20</text><text x="30" y="152" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.21</text><text x="30" y="176" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.22</text><text x="30" y="200" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.25</text>

  <rect x="558" y="38" width="248" height="200" rx="6" fill="#EEF1F4" stroke="#CFD7DE"/>
  <text x="682" y="60" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#16202A" text-anchor="middle">Asset inventory</text>
  <text x="682" y="78" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#6E7A87" text-anchor="middle">12 hệ thống trong hồ sơ</text>
  <text x="574" y="104" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.1</text><text x="574" y="128" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.5</text><text x="574" y="152" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.20</text><text x="574" y="176" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.21</text><text x="574" y="200" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F">192.168.10.22</text>

  <rect x="276" y="38" width="268" height="200" rx="6" fill="#FBF7F0" stroke="#E6D9C4"/>
  <text x="410" y="60" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#9A6B00" text-anchor="middle">Ba tình huống chênh lệch</text>
  <circle cx="296" cy="86" r="4" fill="#9A6B00"/>
  <text x="308" y="90" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#16202A">Có hồ sơ, không thấy khi quét</text>
  <text x="308" y="106" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#39444F">Đã ngừng chạy hoặc hồ sơ lạc hậu</text>
  <circle cx="296" cy="132" r="4" fill="#A31621"/>
  <text x="308" y="136" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#A31621">Thấy khi quét, không có hồ sơ</text>
  <text x="308" y="152" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#39444F">Rủi ro cao nhất, không ai chịu trách nhiệm</text>
  <circle cx="296" cy="178" r="4" fill="#6E7A87"/>
  <text x="308" y="182" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#16202A">Có ở cả hai, thông tin khác nhau</text>
  <text x="308" y="198" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#39444F">Hồ sơ cần được rà soát định kỳ</text>

  <rect x="14" y="252" width="792" height="54" rx="6" fill="#F0F6F3"/>
  <text x="30" y="274" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#15604E">Câu hỏi cho từng dịch vụ phát hiện được: dịch vụ này phục vụ nghiệp vụ nào?</text>
  <text x="30" y="294" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#39444F">Dịch vụ không trả lời được câu hỏi này là dịch vụ nên tắt. Đây là biện pháp giảm rủi ro có chi phí bằng không.</text>
</svg>