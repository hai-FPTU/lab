  <text x="36" y="227" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#39444F">Dữ liệu nằm trong Loki. Màn hình trống thì lỗi ở Loki hoặc ở khoảng thời gian, hầu như không bao giờ ở Grafana.</text>
