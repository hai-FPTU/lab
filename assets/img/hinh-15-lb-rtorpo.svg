<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Bốn mốc thời gian đo RTO và RPO">
  <rect width="820" height="250" fill="#fff"/>
  <text x="14" y="26" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#16202A">Bốn mốc thời gian phải ghi lại trong bài 2.4</text>
  <line x1="70" y1="110" x2="770" y2="110" stroke="#CFD7DE" stroke-width="3"/>
  <circle cx="130" cy="110" r="9" fill="#15604E"/><text x="130" y="115" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="130" y="90" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#16202A" text-anchor="middle">Sao lưu</text><text x="130" y="136" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F" text-anchor="middle">09:00:00</text><circle cx="340" cy="110" r="9" fill="#A31621"/><text x="340" y="115" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="340" y="90" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#16202A" text-anchor="middle">Phát hiện</text><text x="340" y="136" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F" text-anchor="middle">10:20:00</text><circle cx="530" cy="110" r="9" fill="#9A6B00"/><text x="530" y="115" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="530" y="90" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#16202A" text-anchor="middle">Bắt đầu khôi phục</text><text x="530" y="136" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F" text-anchor="middle">10:26:00</text><circle cx="740" cy="110" r="9" fill="#15604E"/><text x="740" y="115" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="740" y="90" font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#16202A" text-anchor="middle">Hoàn thành</text><text x="740" y="136" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#39444F" text-anchor="middle">10:41:00</text>
  <path d="M130 168 L130 180 L340 180 L340 168" fill="none" stroke="#A31621" stroke-width="1.6"/>
  <text x="235" y="198" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#A31621" text-anchor="middle">RPO = 1 giờ 20 phút</text>
  <text x="235" y="215" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#6E7A87" text-anchor="middle">Lượng dữ liệu đã mất</text>
  <path d="M340 60 L340 48 L740 48 L740 60" fill="none" stroke="#15604E" stroke-width="1.6"/>
  <text x="540" y="40" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#15604E" text-anchor="middle">RTO = 21 phút</text>
  <rect x="14" y="222" width="792" height="22" rx="4" fill="#EEF1F4"/>
  <text x="26" y="237" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#39444F">Con số trong hình là ví dụ. Học viên điền mốc thật đo được trên máy của mình.</text>
</svg>